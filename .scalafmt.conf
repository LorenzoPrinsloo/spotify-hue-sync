# Formatting for the code and the sbt files. Run `sbt fix` to format, `sbt lint` to check.
# Set to change as little as possible: existing line breaks and braces are kept, nothing is aligned, and arguments
# grouped on one line (a slider's `min = 0, max = 1, step = 0.01`) stay grouped.
version = 3.11.5
runner.dialect = scala3
maxColumn = 150

newlines.source = keep
newlines.inInterpolation = avoid
newlines.configStyle.callSite.prefer = false
binPack.callSite = always
align.preset = none
indent.defnSite = 2
docstrings.style = keep

rewrite.scala3.convertToNewSyntax = false
rewrite.scala3.removeOptionalBraces = no
