# Rules for tests: the same as .scalafix.conf, without the checks on running IO, since test bodies may run it directly.
rules = [
  # Syntactic
  DisableSyntax
  CatsImplicitsImport
  CollectHeadOption
  EitherGetOrElse
  FilterSize
  KindProjectorScala3TypeLambda
  Scala3Placeholder
  Implicit
  MapSequenceTraverse
  OptionMatchToRight
  DefImplicitParamToUsingParam
  Scala3ImportRewrite
  UnnecessaryMatch
  DirectoryAndPackageName
  FileNameConsistent
  RemoveSamePackageImport
  DuplicateWildcardImport
  RemoveEmptyObject
  UnusedConstructorParams
  UnusedTypeParams
  UnusedSelfType
  SameParamOverloading
  EnumDerivesCanEqual
  EnumUnnecessaryExtends
  ObjectFinal
  IntersectionType
  RedundantSyntax
  OptionGetOrElse
  OptionContains
  OptionForallExists
  OptionMapFlatMap
  EitherMap
  IsEmptyNonEmpty
  FilterNot
  SimplifyForYield
  StringFormatToInterpolation
  CaseClassExplicitCopy
  RedundantCaseClassVal
  RemoveIf
  UnnecessarySort
  MapFlattenFlatMap
  DubiousLiteral
  BigDecimalFromDoubleLiteral
  ScalaUtilUsingResource
  OptionWhenUnless
  RemoveParameterUntuplingCase
  UnnecessaryCase
  ForTupleMatch
  InterpolationToString
  CollectHead
  FlatMapCollect
  GroupMap
  MapDistinctSize
  ReplaceFill
  ReuseInstances
  # Semantic: these need the SemanticDB the build turns on
  TypelevelMapSequence
  TypelevelAs
  OptionGetWarn
  ThrowableToNonFatal
  # Reported as a warning only (not in lint.error), so it never fails the check
  SeparateEachFileWarn
]

# Lint-only rules report warnings, which `sbt lint` lets through; these are promoted to errors so they fail it.
lint.error = "Implicit|CatsImplicitsImport|DirectoryAndPackageName|FileNameConsistent|DuplicateWildcardImport|RemoveEmptyObject|UnusedConstructorParams|UnusedTypeParams|UnusedSelfType|SameParamOverloading|EnumUnnecessaryExtends|ObjectFinal|IntersectionType|OptionContains|OptionMapFlatMap|EitherMap|IsEmptyNonEmpty|StringFormatToInterpolation|CaseClassExplicitCopy|RedundantCaseClassVal|UnnecessarySort|DubiousLiteral|BigDecimalFromDoubleLiteral"

DisableSyntax {
  noXml = true
  noFinalize = true
  noReturns = true
  noIsInstanceOf = true
  noNulls = true
  regex = [
    { id = implicitly, pattern = "\\bimplicitly\\[", message = "Use summon[...] (Scala 3)." }
  ]
}
