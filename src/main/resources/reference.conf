# Defaults. Override any of these in application.conf.

polling-interval-ms = 2000

# The settings page, for trying out light-show settings while the app runs. Changes take effect when the next song
# starts, last until the app stops, and never touch this file.
ui {
  enabled = true
  # 127.0.0.1 keeps the page to this computer. 0.0.0.0 opens it to your home network, so you can use it from your
  # phone, but then anyone on the network can change the lights.
  host = "127.0.0.1"
  port = 7071
}

light-show {
  # The entertainment area (a music or TV area from the Hue app) to play on, by name, for example:
  # area = "Living room"
  # Without one, the app uses hue.zone-id, or the bridge's only music area. The settings page can switch areas.

  # analogous, complementary, monochromatic, triadic, tetradic,
  # analogous-complementary or analogous-complementary-interspersed
  palette = "analogous"

  # Build each song's palette from the most vivid colour on its album cover; false picks a random colour as before
  album-cover-colours = true

  # Where the pulse timing comes from: "spotify" (playback position and track tempo)
  # or "audio" (the beat detected live from an audio input such as BlackHole)
  beat-source = "spotify"

  audio {
    # Matched against the names of your audio inputs, ignoring case
    device = "BlackHole"
    # Shifts the lights relative to the detected beat; positive is earlier, to make up for latency
    offset-ms = 100
    # Tempo range the beat tracker searches
    min-bpm = 60
    max-bpm = 180
    # Through quiet or unclear passages, keep pulsing at the last confident beat for this long
    hold-seconds = 10
  }

  # How the show reacts to live audio beyond the beat (only with beat-source = "audio")
  reactive {
    enabled = true
    # Brightness follows the music's energy, between these multiples of normal
    quietest = 0.35
    loudest = 1.6
    # Degrees the palette of pulse lights turns as the treble (hi-hats, cymbals) picks up or drops away
    colour-shift = 25
    # A big hit (a crash or a drop) flashes every light towards white
    flash = 0.7
    flash-decay-ms = 200
    # How much louder than anything in the last few seconds counts as a big hit
    hit-ratio = 1.15
    # A treble onset twinkles one light (not a rhythm light) towards white
    sparkle = 0.6
    sparkle-decay-ms = 100
    # How far above the usual treble background counts as a sparkle
    sparkle-ratio = 4.0

    # Each light's job, repeated across the zone's lights in channel order:
    #   "rhythm" pulses with the kick pattern of the bar, played ahead on the beat grid so it lands on time
    #   "colour" swells every couple of beats, and moves along the palette as the vocals and melody go higher or lower
    #   "pulse"  the classic pulse travelling across the zone
    # Use ["pulse"] for the classic show on every light
    roles = ["rhythm", "colour"]
    # How far colour lights move along the palette, in palette colours, when the music is at its highest or lowest
    colour-reach = 1.0
    # The swell of the colour lights: a slow rise, a brief hold at the peak, then a fade
    colour-swell {
      # One swell every this many beats, peaking on the beat
      beats = 2
      # Fractions of a swell spent rising, then holding at the peak
      attack = 0.45
      sustain = 0.1
      # Shape of the fade after the peak; higher fades faster
      decay-curve = 2.0
      # Brightness at rest, and how much the peak adds on top, as multiples of the colour's own
      rest-level = 0.25
      peak-boost = 0.75
    }
    # How calmly rhythm lights follow the kick pattern; 0 switches each one off
    rhythm {
      # Kicks closer together than this merge into one pulse, on the first kick's sixteenth
      min-gap-ms = 160
      # A sixteenth lights only once it stands out by this share of the gap between the bar's typical and loudest sixteenth
      threshold = 0.3
      # Slows how far the rhythm lights' strength can move from one bar to the next
      smoothing = 0.5
    }
  }

  # Used when Spotify can't provide the track's tempo
  default-bpm = 20

  # Pulse once every N beats of the track; 2 pulses on every other beat
  beats-per-pulse = 1

  # Shifts the lights relative to the audio; negative is earlier
  sync-offset-ms = -150

  # Time between frames sent to the bridge (16 ms is about 60 frames a second)
  frame-interval-ms = 16

  pulse {
    # Each light starts its pulse this fraction of a beat after the previous one
    stagger = 0.15
    # Fractions of a pulse spent rising, then holding at full brightness
    attack = 0.2
    sustain = 0.1
    # Shape of the fade after the peak; higher fades faster
    decay-curve = 2.0
    # Brightness multiplier at rest, and how much the peak adds on top
    rest-level = 0.15
    peak-boost = 2.5
  }

  pause {
    # Colour the lights fade to when nothing is playing
    resting-colour = "#1e1408"
    fade-out-ms = 2000
  }
}
