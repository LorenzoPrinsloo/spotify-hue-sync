spotify {
  client-id = ${SPOTIFY_CLIENT_ID}
  client-secret = ${SPOTIFY_CLIENT_SECRET}
  refresh-token = ""
  refresh-token = ${?SPOTIFY_REFRESH_TOKEN}
}

hue {
  # The entertainment area to play on, by id; light-show.area picks one by name instead
  zone-id = ${?HUE_ZONE_ID}
  creds {
    address = ${HUE_BRIDGE_ADDRESS} // Hub Address
    username = ${HUE_USERNAME}
    psk = ${HUE_PSK}
  }
}

polling-interval-ms = 1000

# Light show tuning. Defaults and descriptions are in reference.conf; override any of them here, for example:
# light-show {
#   area = "Living room"
#   palette = "triadic"
#   pause.resting-colour = "#0a0a20"
# }

light-show.beat-source = "audio"
