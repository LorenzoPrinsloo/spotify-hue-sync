<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Light show settings</title>
  <style>
    :root { color-scheme: dark; --bg: #14121a; --card: #1f1c28; --line: #322d40; --text: #ece8f4; --muted: #9a93ab; --accent: #f0a640; --bad: #ff6b6b; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.45 system-ui, -apple-system, sans-serif; }
    .page { max-width: 1100px; margin: 0 auto; padding: 24px 16px 64px; }
    header { position: sticky; top: 0; z-index: 1; background: var(--bg); padding-bottom: 12px; border-bottom: 1px solid var(--line); }
    h1 { margin: 0 0 4px; font-size: 22px; }
    h2 { margin: 0 0 2px; font-size: 17px; }
    header p { margin: 4px 0; color: var(--muted); }
    .actions { display: flex; gap: 8px; margin: 10px 0 4px; }
    button { background: var(--card); color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 6px 12px; font: inherit; cursor: pointer; }
    button:hover { border-color: var(--accent); }
    button:disabled { opacity: 0.4; cursor: default; }
    .status { color: var(--accent) !important; }
    .problems { margin: 6px 0 0; padding-left: 18px; color: var(--bad); }
    .sections { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 16px; margin-top: 16px; }
    .section { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; min-width: 0; }
    .intro, .help { color: var(--muted); font-size: 13px; margin: 2px 0 10px; }
    .field { display: flex; flex-direction: column; gap: 4px; min-width: 0; margin: 12px 0; padding-left: 10px; border-left: 3px solid transparent; }
    .field.waiting { border-left-color: var(--accent); }
    .field label { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
    .value { font-variant-numeric: tabular-nums; color: var(--accent); }
    input[type=range] { width: 100%; accent-color: var(--accent); }
    select { width: 100%; min-width: 0; text-overflow: ellipsis; background: var(--bg); color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 4px 6px; font: inherit; }
    .roles { display: flex; flex-direction: column; gap: 6px; margin-top: 6px; }
    .role { display: flex; gap: 8px; align-items: center; }
    .role select { flex: 1; width: auto; }
    .index { width: 1.5em; color: var(--muted); }
    textarea { width: 100%; background: var(--bg); color: var(--text); border: 1px solid var(--line); border-radius: 6px; font: 13px ui-monospace, monospace; padding: 8px; margin-bottom: 8px; }
  </style>
</head>
<body>
  <div id="app"></div>
  <script src="main.js"></script>
</body>
</html>
