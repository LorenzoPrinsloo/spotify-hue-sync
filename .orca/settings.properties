# Orca settings for this project. format/lint/test: one shell command per key; `off` disables the gate.
# The review loop runs format before each round and lint with the reviewers; flows run test themselves.
format = sbt -batch scalafmtAll scalafmtSbt
lint = sbt -batch lint
test = sbt -batch check

# harness[:model] per role. QA picks its own agent in its flow.
planningAgent = claude:opus
codingAgent = claude:sonnet
reviewAgent = claude:sonnet
