# Rules for the app's own code; tests use .scalafix.test.conf. Run `sbt fix` to apply rewrites, `sbt lint` to check.
rules = [
  # Syntactic
  DisableSyntax
  CatsImplicitsImport
  CollectHeadOption
  EitherGetOrElse
  FilterSize
  KindProjectorScala3TypeLambda
  Scala3Placeholder
  Implicit
  MapSequenceTraverse
  OptionMatchToRight
  OptionMatchToLeft
  OptionOrElse
  OptionFilter
  EitherFold
  DefImplicitParamToUsingParam
  Scala3ImportRewrite
  UnnecessaryMatch
  DirectoryAndPackageName
  FileNameConsistent
  RemoveSamePackageImport
  DuplicateWildcardImport
  RemoveEmptyObject
  UnusedConstructorParams
  UnusedTypeParams
  UnusedSelfType
  SameParamOverloading
  EnumDerivesCanEqual
  EnumUnnecessaryExtends
  ObjectFinal
  IntersectionType
  RedundantSyntax
  OptionGetOrElse
  OptionContains
  OptionForallExists
  OptionMapFlatMap
  EitherMap
  IsEmptyNonEmpty
  FilterNot
  SimplifyForYield
  StringFormatToInterpolation
  CaseClassExplicitCopy
  RedundantCaseClassVal
  RemoveIf
  UnnecessarySort
  MapFlattenFlatMap
  DubiousLiteral
  BigDecimalFromDoubleLiteral
  ScalaUtilUsingResource
  OptionWhenUnless
  RemoveParameterUntuplingCase
  UnnecessaryCase
  ForTupleMatch
  InterpolationToString
  CollectHead
  FlatMapCollect
  GroupMap
  MapDistinctSize
  ReplaceFill
  ReuseInstances
  # Semantic: these need the SemanticDB the build turns on
  TypelevelMapSequence
  TypelevelAs
  OptionGetWarn
  ThrowableToNonFatal
  # Reported as a warning only (not in lint.error), so it never fails the check
  SeparateEachFileWarn
]

# Lint-only rules report warnings, which `sbt lint` lets through; these are promoted to errors so they fail it.
lint.error = "Implicit|CatsImplicitsImport|DirectoryAndPackageName|FileNameConsistent|DuplicateWildcardImport|RemoveEmptyObject|UnusedConstructorParams|UnusedTypeParams|UnusedSelfType|SameParamOverloading|EnumUnnecessaryExtends|ObjectFinal|IntersectionType|OptionContains|OptionMapFlatMap|EitherMap|IsEmptyNonEmpty|StringFormatToInterpolation|CaseClassExplicitCopy|RedundantCaseClassVal|UnnecessarySort|DubiousLiteral|BigDecimalFromDoubleLiteral"

DisableSyntax {
  noXml = true
  noFinalize = true
  noReturns = true
  noIsInstanceOf = true
  noNulls = true
  regex = [
    { id = implicitly, pattern = "\\bimplicitly\\[", message = "Use summon[...] (Scala 3)." }
    {
      id = booleanMatch
      # Two cases on a Boolean read better as if/else; no rule in the pinned rule sets rewrites them.
      pattern = "\\bcase\\s+(true|false)\\s*(=>|if\\b|\\|)"
      message = "Use if/else (or ifM) instead of matching on a Boolean."
    }
    {
      id = unsafeRun
      # IO's runtime-bound runners take no arguments; Dispatcher's (the sanctioned bridge from Java callbacks) do.
      pattern = "\\.unsafe(RunSync|RunAndForget|RunTimed|ToFuture|ToCompletableFuture|RunAsync|RunCancelable|RunAsyncOutcome)\\(\\)"
      message = "Run IO only at the edge (IOApp) or through a Dispatcher, never on the global runtime."
    }
    {
      id = globalRuntime
      # Every IO runner needs an IORuntime; outside IOApp that means the global one. Catches the runners that take
      # arguments (unsafeRunAsync(cb), unsafeRunTimed(limit), ...), which the pattern above can't tell from Dispatcher's.
      pattern = "unsafe\\.implicits\\.global|IORuntime\\.global|\\.unsafeRunAsyncOutcome\\("
      message = "Don't use the global IORuntime outside IOApp; run effects through a Dispatcher."
    }
  ]
}
